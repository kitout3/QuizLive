<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Mon espace — QuizLive</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/dashboard-stage3.css">
  <link rel="stylesheet" href="css/dashboard-stage4.css">
  <link rel="stylesheet" href="css/dashboard-enterprise-groups.css">
  <link rel="stylesheet" href="css/enterprise-delete-icons.css?v=62">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body data-page="dashboard" class="dashboard-page">
  <div class="dashboard-shell">
    <aside class="dashboard-sidebar" id="dashboardSidebar">
      <a class="dashboard-brand" href="index.html"><span>⚡</span><strong>QuizLive</strong></a>
      <nav class="dashboard-nav" aria-label="Navigation organisateur">
        <button class="dashboard-nav-item active" data-section="overview">📊 Vue d’ensemble</button>
        <button class="dashboard-nav-item" data-section="quizzes">📚 Mes quiz</button>
        <button class="dashboard-nav-item" data-stage3-section="history">🕘 Historique</button>
        <button class="dashboard-nav-item" data-section="organization">🏢 Espace entreprise</button>
        <button class="dashboard-nav-item" data-section="billing">💳 Abonnement</button>
        <button class="dashboard-nav-item" data-section="profile" data-stage3-section="profile">👤 Mon profil</button>
        <button class="dashboard-nav-item" data-stage3-section="settings">⚙️ Paramètres</button>
      </nav>
      <div class="dashboard-sidebar-bottom">
        <a class="dashboard-nav-item" href="index.html">← Retour à l’accueil</a>
        <button class="dashboard-nav-item danger" id="dashboardLogout">↪ Se déconnecter</button>
      </div>
    </aside>

    <main class="dashboard-main">
      <header class="dashboard-topbar">
        <button class="dashboard-menu-button" id="dashboardMenuButton" aria-label="Ouvrir le menu">☰</button>
        <div><h1 id="dashboardTitle">Vue d’ensemble</h1><p id="dashboardSubtitle">Gérez vos quiz et votre compte organisateur.</p></div>
        <a class="btn-primary dashboard-create" href="index.html?create=1">+ Créer un quiz</a>
      </header>
      <section id="dashboardContent" class="dashboard-content"><div class="dashboard-loading">Chargement de votre espace…</div></section>
    </main>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="js/config.js?v=62"></script>
  <script src="js/dashboard-page.js?v=62"></script>
  <script src="js/dashboard-stage3.js?v=62"></script>
  <script src="js/dashboard-stage4.js?v=62"></script>
  <script src="js/editor-navigation.js?v=62"></script>
  <script src="js/enterprise-membership-bridge.js?v=62"></script>
  <script src="js/dashboard-enterprise-groups.js?v=62"></script>
  <script src="js/enterprise-email-invites.js?v=62"></script>
  <script src="js/enterprise-email-invites-fix.js?v=62"></script>
  <script src="js/enterprise-access-view.js?v=62"></script>
  <script src="js/enterprise-delete-icons.js?v=62"></script>
  <script src="js/enterprise-management-v2.js?v=62"></script>
</body>
</html>
