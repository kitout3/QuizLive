<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Mot de passe oublié - QuizLive</title>
  <link rel="stylesheet" href="css/style.css?v=76">
  <link rel="stylesheet" href="css/auth-pages.css?v=76">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="auth-page" data-auth-page="forgot">
  <div class="background-effects"><div class="gradient-orb orb-1"></div><div class="gradient-orb orb-2"></div><div class="grid-overlay"></div></div>
  <header class="auth-header"><a class="auth-brand" href="index.html">⚡ QuizLive</a><a class="auth-back" href="login.html">← Connexion</a></header>
  <main class="auth-main">
    <section class="auth-card">
      <h1>Mot de passe oublié</h1>
      <p class="auth-intro">Saisissez l’adresse email de votre compte. Vous recevrez un lien pour définir un nouveau mot de passe.</p>
      <form id="authForm">
        <div class="auth-field"><label for="authEmail">Email</label><input id="authEmail" type="email" autocomplete="email" placeholder="email@exemple.com" required></div>
        <div id="authPageError" class="auth-error" role="alert"></div>
        <div id="authPageSuccess" class="auth-success" role="status"></div>
        <button id="authSubmit" class="auth-submit" type="submit">Envoyer le lien</button>
      </form>
      <div class="auth-links"><a href="login.html">Retour à la connexion</a><a href="register.html">Créer un compte</a></div>
    </section>
  </main>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="js/config.js?v=76"></script>
  <script src="js/auth-pages.js?v=76"></script>
</body>
</html>
