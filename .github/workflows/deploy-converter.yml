name: Deploy PPTX Converter

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'services/pptx-converter/**'
      - '.github/workflows/deploy-converter.yml'

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and deploy
        run: |
          gcloud run deploy quizlive-pptx-converter \
            --source services/pptx-converter \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --region "${{ secrets.GCP_REGION }}" \
            --platform managed \
            --allow-unauthenticated \
            --memory 2Gi \
            --cpu 2 \
            --timeout 300 \
            --max-instances 10 \
            --set-env-vars "STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }},ALLOWED_ORIGINS=https://kitout3.github.io"
