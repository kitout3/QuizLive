name: Déployer le mot de passe QuizLive

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quizlive-password-reset-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Déployer requestPasswordReset
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package.json

      - name: Authentification Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_QUIZLIVE_APP }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Installer les dépendances de la fonction
        run: npm install --prefix functions --no-audit --no-fund

      - name: Installer Firebase CLI
        run: npm install --global firebase-tools

      - name: Déployer la fonction de réinitialisation
        run: firebase deploy --only functions:requestPasswordReset --project quizlive-app --non-interactive

      - name: Adresse du service
        run: echo "https://europe-west1-quizlive-app.cloudfunctions.net/requestPasswordReset"
