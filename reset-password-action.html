<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Réinitialiser le mot de passe — QuizLive</title>
  <link rel="stylesheet" href="css/style.css?v=79">
  <link rel="stylesheet" href="css/auth-pages.css?v=79">
  <link rel="stylesheet" href="css/reset-password-action.css?v=79">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="auth-page reset-action-page" data-auth-page="reset-action">
  <div class="background-effects">
    <div class="gradient-orb orb-1"></div>
    <div class="gradient-orb orb-2"></div>
    <div class="grid-overlay"></div>
  </div>

  <header class="auth-header">
    <a class="auth-brand" href="index.html">⚡ QuizLive</a>
    <a class="auth-back" href="login.html">← Connexion</a>
  </header>

  <main class="auth-main">
    <section class="auth-card reset-action-card">
      <div class="reset-action-icon" id="resetActionIcon">🔐</div>
      <h1 id="resetActionTitle">Réinitialiser votre mot de passe</h1>
      <p class="auth-intro" id="resetActionIntro">Vérification sécurisée du lien en cours…</p>

      <div id="resetActionLoading" class="reset-action-loading" aria-live="polite">
        <span class="reset-spinner" aria-hidden="true"></span>
        <span>Vérification du lien…</span>
      </div>

      <form id="resetPasswordForm" hidden>
        <div class="reset-account">
          <span>Compte concerné</span>
          <strong id="resetAccountEmail"></strong>
        </div>

        <div class="auth-field">
          <label for="newPassword">Nouveau mot de passe</label>
          <div class="auth-password-wrap">
            <input id="newPassword" type="password" autocomplete="new-password" minlength="8" placeholder="8 caractères minimum" required>
            <button type="button" class="auth-eye" data-toggle-password="newPassword" aria-label="Afficher le mot de passe">👁</button>
          </div>
        </div>

        <div class="auth-field">
          <label for="confirmNewPassword">Confirmer le mot de passe</label>
          <div class="auth-password-wrap">
            <input id="confirmNewPassword" type="password" autocomplete="new-password" minlength="8" placeholder="Saisissez de nouveau le mot de passe" required>
            <button type="button" class="auth-eye" data-toggle-password="confirmNewPassword" aria-label="Afficher le mot de passe">👁</button>
          </div>
        </div>

        <div class="reset-password-rules">
          <span id="passwordLengthRule">○ Au moins 8 caractères</span>
          <span id="passwordMatchRule">○ Les deux mots de passe sont identiques</span>
        </div>

        <div id="resetActionError" class="auth-error" role="alert"></div>
        <button id="resetPasswordSubmit" class="auth-submit" type="submit">Enregistrer le nouveau mot de passe</button>
      </form>

      <div id="resetActionResult" class="reset-action-result" hidden aria-live="polite">
        <p id="resetActionMessage"></p>
        <a id="resetActionPrimaryLink" class="auth-submit reset-action-link" href="login.html">Se connecter</a>
        <a id="resetActionSecondaryLink" class="reset-secondary-link" href="forgot-password.html">Demander un nouveau lien</a>
      </div>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="js/config.js?v=79"></script>
  <script src="js/reset-password-action.js?v=79"></script>
</body>
</html>
